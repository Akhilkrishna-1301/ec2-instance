# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Create EC2 using Terraform

"on":
  workflow_dispatch:
    inputs:
      action:
        description: "Select Terraform action"
        required: true
        type: choice
        options:
          - test
          - create
          - destroy

# GitHub Actions permissions
permissions:
  id-token: write
  contents: read

# Prevent simultaneous Terraform operations
concurrency:
  group: aws-ec2-terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Provision AWS EC2
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: true
      AWS_REGION: ap-south-1

    steps:

      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 3: Debug GitHub Context
      - name: Debug GitHub Context
        run: |
          echo "================================="
          echo "GitHub Actions Context"
          echo "================================="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Actor: $GITHUB_ACTOR"
          echo "================================="

      # Step 4: Verify AWS Role ARN
      - name: Verify AWS Role Configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "ERROR: AWS_ROLE_ARN repository variable is missing."
            exit 1
          fi

          echo "AWS IAM role ARN is configured."

            # Debug actual GitHub OIDC token claims
      - name: Debug OIDC Claims
        shell: bash
        run: |
          set -euo pipefail

          echo "Requesting GitHub OIDC token..."

          TOKEN_RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi

          export OIDC_TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("========== OIDC CLAIMS ==========")
          print("Issuer:     ", claims.get("iss"))
          print("Audience:   ", claims.get("aud"))
          print("Subject:    ", claims.get("sub"))
          print("Repository: ", claims.get("repository"))
          print("Reference:  ", claims.get("ref"))
          print("=================================")
          PY    

      # Step 5: Configure AWS credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: GitHubActionsTerraformSession

      # Step 6: Verify AWS authentication
      - name: Verify AWS Identity
        run: |
          echo "Checking AWS authentication..."
          aws sts get-caller-identity

      # Step 7: Initialize Terraform
      - name: Terraform Init
        run: terraform init -input=false

      # Step 8: Check Terraform formatting
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Step 9: Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Step 10: Generate Terraform plan
      - name: Terraform Plan
        if: ${{ inputs.action == 'create' }}
        run: terraform plan -input=false -out=tfplan

      # Step 11: Create AWS infrastructure
      - name: Terraform Apply
        if: ${{ inputs.action == 'create' }}
        run: terraform apply -input=false -auto-approve tfplan

      # Step 12: Display EC2 details
      - name: EC2 Instance Details
        if: ${{ inputs.action == 'create' }}
        run: terraform output

      # Step 13: Destroy AWS infrastructure
      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -input=false -auto-approve